[DEFAULT]
# ---- 基础配置 ----
request_timeout = 10
# 同一主机两次请求之间的最小间隔（秒）。全局限速，与 --thread 无关：
# 调大线程数不会像以前那样成倍放大实际请求速率。
# 说明：旧版本是「每个线程各自 sleep 1 秒、并发 5 线程」，实际聚合速率可达
# 5 请求/秒。现在默认 0.3（约 3.3 请求/秒）比旧行为更保守，同时把单桶耗时
# 从 100 秒以上降到 15 秒以内。要更保守就调大，要更快就调小（0 = 不限速）。
request_interval = 0.3
# 每个主机允许的突发请求数（令牌桶容量）
request_burst = 5
max_retry = 2
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
# 为 true 时只使用 HTTPS，不再尝试明文 HTTP
https_only = false

# 代理地址。留空表示直连；命令行 --proxy 优先于这里。
# 扫描目标、抓取 HostId 页面以及调用 AI 的请求都会走这个代理，
# 确保所有外发流量可被统一审计。
# 例：http://127.0.0.1:7897
proxy =

# ---- 写操作总闸门（重要）----
# 本工具会通过 PUT/POST/DELETE 与修改 ACL 来验证「匿名写入/删除」类漏洞，
# 这些操作会在目标桶里产生真实对象。为它们设置一个总开关，默认关闭，
# 确保在未明确授权的情况下不会修改目标数据。
#
# false（默认）：所有写操作与 ACL 修改一律跳过，并在日志中说明原因。
# true          ：放行写操作，具体执行哪些仍由下面的各项开关决定。
allow_intrusive_write = false

# ---- 漏洞检测开关（true=开启，false=关闭）----
# 只读检查
scan_cors = true
scan_logs = true
scan_directory_traversal = true
scan_sensitive_headers = true
scan_bucket_policy = true
scan_kms_encryption = true

# ---- 扩展只读检查 ----
# 读取 ACL 授权项：识别 AllUsers / AuthenticatedUsers 这类过宽授权
scan_acl_read = true
# 版本控制检查：历史版本是否可被取回（删除文件不等于数据消失）、
# 是否缺少 MFA 删除保护
scan_version_leak = true
# 静态网站托管、防盗链（Referer 白名单）、跨账号复制规则
scan_website = true
scan_referer = true
scan_replication = true

# 写入类检查：除下面的开关外，还需 allow_intrusive_write = true
scan_put_upload = true
scan_post_upload = true
scan_delete_perm = true
# 阿里云 / GCP 的对象与 Bucket ACL 可写检测
scan_acl_write = true
# Azure 标记为私有的 Blob 是否可被匿名读取
scan_blob_public_access = true

[STS]
# ---- 临时凭证（STS）----
# 目的：以认证身份扫描，才能看到匿名看不到的配置（ACL 授权项、版本历史、
# 策略详情等）。
#
# 两种用法：
#
# 用法一（推荐）：用长期凭证自动换取临时凭证（AssumeRole）
#   已实现 AWS 与阿里云的签名方案；腾讯云 / 华为云请用用法二。
#   需要长期凭证具备 sts:AssumeRole 权限。
#
#   role_arn = acs:ram::1234567890:role/oss-scanner        # 阿里云
#   role_arn = arn:aws:iam::123456789012:role/oss-scanner  # AWS
#   role_ak = <长期 AccessKeyId>     # 或环境变量 OSS_SCANNER_ROLE_AK
#   role_sk = <长期 AccessKeySecret> # 或环境变量 OSS_SCANNER_ROLE_SK
#   role_session_name = oss-scanner  # 会话名，默认自动附加时间戳
#   duration = 3600                  # 有效期（秒）
#   endpoint =                       # 留空用官方 STS 端点
#
# 用法二：直接提供现成的临时凭证
#   优先级：命令行 --sts-* > 环境变量 > credential_file > 本节。
#   推荐用环境变量，避免在配置文件里留明文：
#     export OSS_SCANNER_STS_AK=...
#     export OSS_SCANNER_STS_SK=...
#     export OSS_SCANNER_STS_TOKEN=...
#   也可以指向一个 JSON 文件，AssumeRole 的响应原样保存即可
#   （程序会自动取出 Credentials 字段）。
credential_file =

# role_arn =
# role_ak =
# role_sk =
# role_session_name = oss-scanner
# duration = 3600
# endpoint =

[CLOUD_TEMPLATES]
# 各厂商存储桶 URL 模板，统一使用 https 书写。
# 明文 HTTP 形式由程序按 https 模板自动推导：只有 https_only = false 时
# 才会额外探测 HTTP，因此不需要单独配置 http 模板。
aliyun_https = https://{bucket}.oss-{region}.aliyuncs.com
tencent_https = https://{bucket}-{appid}.cos.{region}.myqcloud.com
tencent_https_no_appid = https://{bucket}.cos.{region}.myqcloud.com
huawei_https = https://{bucket}.obs.{region}.myhuaweicloud.com
aws_https = https://{bucket}.s3.{region}.amazonaws.com
gcp_https = https://{bucket}.storage.googleapis.com
azure_blob_url = https://{account}.blob.core.windows.net/{container}

[SENSITIVE_PATHS]
# 逗号分隔。条目内允许有空格，程序会逐个 strip。
key_paths = .env, credentials.json, access_key.txt, secret_key.txt, id_rsa, private_key.pem
db_paths = backup/database.sql, db/dump.sql, database_backup.zip, db.bak, sql.gz
config_paths = config/database.yml, conf/app.conf, wp-config.php, src/config.php
log_paths = logs/app.log, access.log, error.log
src_paths = wwwroot/.git/config, backup/site.tar.gz, src.zip

[LOG_CONFIG]
log_file = oss_scan.log
log_level = INFO

[ALERT_CONFIG]
dingtalk_webhook = ""
email_smtp = smtp.qq.com
email_user = ""
email_pass = ""
email_to = ""

[AUTO_EXTRACT]
# 自动提取 HostID 的默认目标网址
hostid_url = ""
# 超时时间（秒）
timeout = 10
# 重试次数
retry = 2

[AI_CONFIG]
# ---- AI 研判能力（可选，默认关闭）----
# 说明：AI 只产出「建议」，不改变扫描结论。任何一步失败都会降级为无 AI 结论，
# 本地报告照常产出，不会因为模型不可用而中断扫描。
enabled = false

# 厂商预设。切换厂商只需改这一行，base_url / model 会自动跟随；
# 也可以在下面显式覆盖。
#   ollama     本地 Ollama（推荐，数据不出本机）
#   deepseek   DeepSeek（深度求索）
#   openai     OpenAI
#   dashscope  阿里云百炼 / 通义千问
#   zhipu      智谱 GLM
#   moonshot   月之暗面 Kimi
#   siliconflow 硅基流动
#   custom     自定义 OpenAI 兼容端点（需自行填 base_url 与 model）
provider = ollama

# 留空则使用所选预设的默认端点；需包含版本路径
base_url =
model =

# 云端厂商需要 API Key。留空时按「通用变量 OSS_SCANNER_AI_KEY >
# 厂商约定变量（如 DEEPSEEK_API_KEY）」的顺序从环境变量读取，
# 这样密钥不必落在配置文件里。
api_key =

timeout = 60
max_tokens = 2048

# 启用哪些 AI 步骤，逗号分隔：
#   report   —— 生成执行摘要、风险排序与修复计划
#   analyze  —— 误报降噪，为每条结果补充置信度与依据
#   classify —— 对已泄露文件做凭据识别（本地正则先筛，只把掩码片段发给模型）
features = report,analyze,classify

# 脱敏：为 true 时把 URL 中的 Bucket 名替换为短哈希，并掩码文本中的凭据形态内容
redact = true

# 结果缓存文件，避免重复调用同一问题
cache = ai_cache.json

# ---- 数据外发闸门（重要）----
# base_url 不是本机地址时，必须显式设为 true（或加 --i-accept-ai-egress）才会调用，
# 因为把目标地址与泄露内容发送给第三方可能超出授权测试的范围。
ack_data_egress = false
